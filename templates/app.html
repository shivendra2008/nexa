<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXA · Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="bg-fx" aria-hidden="true"><div class="grid"></div><span class="o o1"></span><span class="o o2"></span></div>
  <div class="shell">
    <aside class="side" id="side">
      <a href="/" class="logo"><span class="logo-mark"></span>NEXA</a>
      <nav class="side-nav" id="sideNav"><span class="nav-indicator" id="navInd"></span></nav>
      <div class="side-foot">
        <div class="mode" id="ppMode"><i></i><span>PayPal: …</span></div>
        <div class="mode" id="aiMode"><i></i><span>AI: …</span></div>
        <div id="bizName" class="t2"></div>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="topbar">
        <button class="btn sm ghost menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div>
          <h1 id="viewTitle">Overview</h1>
          <div class="sub" id="viewSub"></div>
        </div>
        <div class="spacer"></div>
        <div class="agent-pill" id="agentPill" title="Proactive agent"><span class="pulse"></span><span id="agentText">Agent monitoring</span></div>
        <div class="ask-quick" id="askQuick">✦ Ask NEXA anything… <span class="muted" style="margin-left:auto">↵</span></div>
      </div>
      <div class="view" id="view"></div>
    </main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
